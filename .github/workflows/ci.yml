name: LLRT CI
on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

# Only run on the latest ref
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: | #create mock js files
          mkdir -p bundle/js
          for i in {1..5}; do
            echo "console.log(123);" > "bundle/js/test$i.js"
          done
          cargo clippy --all-targets -- -D warnings
  wpt:
    needs:
      - check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout WPT submodule
        run: git submodule update --init --checkout --depth 1 --force wpt
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version: lts/*
      - name: Install Linux dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install make nodejs
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          yarn
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Run WPT
        run: make check-wpt
  crypto-pqc:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [rust, openssl]
        pqc: ["0", "1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version: lts/*
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          yarn
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Build test bundles
        run: JS_MINIFY=0 TEST_SUB_DIR=unit node build.mjs
      - name: Test modern WebCrypto with and without PQC
        env:
          LLRT_TEST_PQC: ${{ matrix.pqc }}
          CRYPTO_PROVIDER: ${{ matrix.provider }}
        shell: bash
        run: |
          set -euo pipefail
          features="macro,tls-ring,crypto-${CRYPTO_PROVIDER}"
          if [ "$LLRT_TEST_PQC" = "1" ]; then
            features="$features,pqc"
          fi
          cargo run --locked --no-default-features --features "$features" -- \
            test -d bundle/js/__tests__/unit crypto.subtle.modern | tee crypto-tests.log
          # The runtime runner currently returns zero even for failed assertions.
          grep -Eq '[1-9][0-9]* passed, 0 failed, [0-9]+ skipped, [1-9][0-9]* tests' crypto-tests.log
          if [ "$LLRT_TEST_PQC" = "1" ]; then
            grep -Eq '[1-9][0-9]* passed, 0 failed, 0 skipped,' crypto-tests.log
          fi
  build:
    needs:
      - check
    strategy:
      fail-fast: ${{ startsWith(github.ref, 'refs/tags/') }}
      matrix:
        include:
          # Ubuntu x64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: nightly
            crypto: ring
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: nightly
            crypto: aws-lc
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: nightly
            crypto: graviola
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: nightly
            crypto: openssl
          # Ubuntu arm64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: nightly
            crypto: ring
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: nightly
            crypto: aws-lc
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: nightly
            crypto: graviola
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: nightly
            crypto: openssl
          # macOS arm64
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: nightly
            crypto: ring
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: nightly
            crypto: aws-lc
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: nightly
            crypto: graviola
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: nightly
            crypto: openssl
          # Windows x64 (ring, openssl, graviola - no aws-lc)
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: nightly-x86_64-pc-windows-gnu
            crypto: ring
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: nightly-x86_64-pc-windows-gnu
            crypto: openssl
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: nightly-x86_64-pc-windows-gnu
            crypto: graviola
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      crypto: ${{ matrix.crypto }}
  modules:
    needs:
      - check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu x64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: stable
            crypto: ring
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: stable
            crypto: aws-lc
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: stable
            crypto: graviola
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            toolchain: stable
            crypto: openssl
          # Ubuntu arm64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: stable
            crypto: ring
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: stable
            crypto: aws-lc
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: stable
            crypto: graviola
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            toolchain: stable
            crypto: openssl
          # macOS arm64
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: stable
            crypto: ring
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: stable
            crypto: aws-lc
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: stable
            crypto: graviola
          - os: macos-latest
            platform: darwin
            arch: aarch64
            toolchain: stable
            crypto: openssl
          # Windows x64 (ring, openssl, graviola - no aws-lc)
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: stable-x86_64-pc-windows-gnu
            crypto: ring
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: stable-x86_64-pc-windows-gnu
            crypto: openssl
          - os: windows-latest
            platform: windows
            arch: x86_64
            toolchain: stable-x86_64-pc-windows-gnu
            crypto: graviola
    uses: ./.github/workflows/build-modules.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      toolchain: ${{ matrix.toolchain }}
      crypto: ${{ matrix.crypto }}
